; Bouwen en flashen:  cd firmware && pio run -t upload
; Wifi komt uit ../.env (WIFI_SSID, WIFI_PASS, optioneel M5_KANAAL) via load_env.py.
; (of open m5stick-zender/m5stick-zender.ino in de Arduino IDE, board 'M5StickCPlus2',
;  bibliotheken M5Unified en PubSubClient)
[platformio]
src_dir = m5stick-zender

[env:m5stick-c-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
extra_scripts = pre:load_env.py
lib_deps =
  m5stack/M5Unified
  knolleary/PubSubClient
